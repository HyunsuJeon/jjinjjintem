<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>찐찐템 오늘의 특가</title>
<style>
:root { --cream:#FFF6EC; --coral:#E8503B; --navy:#1F2A44; --mint:#7FD1B9; --line:#F0E2D2; --muted:#606A80; }
* { box-sizing:border-box; }
body { margin:0; background:var(--cream); color:var(--navy); line-height:1.5;
  font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
main { max-width:640px; margin:0 auto; padding:16px 16px 48px; }
.disclosure { margin:0 0 20px; padding:12px 14px; background:var(--navy); color:var(--cream);
  border-radius:12px; font-size:14px; }
header { display:flex; align-items:center; gap:12px; margin-bottom:8px; }
header img { width:56px; height:56px; border-radius:50%; }
h1 { margin:0; font-size:24px; }
.notice { margin:0 0 24px; color:var(--muted); font-size:14px; }
h2 { margin:32px 0 4px; font-size:20px; }
h3 { margin:16px 0 8px; font-size:16px; color:var(--muted); }
.card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:12px; }
.rank { display:inline-block; padding:2px 10px; border-radius:999px; background:var(--navy);
  color:#fff; font-size:13px; font-weight:700; }
.name { margin:8px 0 4px; font-size:16px; font-weight:700; overflow-wrap:anywhere; }
.price { margin:0; font-size:24px; font-weight:800; color:var(--coral); }
.time { margin:0 0 12px; color:var(--muted); font-size:13px; }
.button { display:block; padding:12px; border-radius:12px; background:var(--navy); color:#fff;
  text-align:center; font-weight:700; text-decoration:none; }
.empty { padding:32px 16px; text-align:center; background:#fff; border:1px solid var(--line);
  border-radius:16px; color:var(--muted); }
</style>
</head>
<body>
<main>
<p class="disclosure">이 페이지는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다</p>
<header><img src="logo.png" alt=""><h1>찐찐템 오늘의 특가</h1></header>
<p class="notice">가격과 재고는 수시로 바뀔 수 있습니다. 구매 전 상품 페이지에서 확인해 주세요.</p>
<p class="empty">가격 기록을 모으는 중입니다. 곧 첫 소식을 올릴게요.</p>
</main>
</body>
</html>
